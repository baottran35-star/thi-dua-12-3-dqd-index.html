.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0a101c55 0%,#0a101c99 55%,#0a101cf2 100%)}.hero>*{position:relative}
.bar2{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}.bar2 button{background:#ffffff1f;color:#fff;border:1px solid #ffffff38;backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4)}
.ht h1{margin:0;font-size:clamp(30px,6vw,46px);font-weight:900;line-height:1.05;letter-spacing:-.025em}.ht p{margin:8px 0 14px;color:#ffffffcc;font-size:15px}
.wkp{display:inline-flex;gap:8px;align-items:center;font-weight:600}.wkp select{background:var(--ch);color:#14213a;border:0;font-weight:800}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 16px;transition:transform .15s,box-shadow .15s,background .15s}button:hover{box-shadow:0 6px 16px -8px #14213a55}button:active{transform:scale(.96)}
button.pr{background:var(--ch);color:#14213a;border-color:var(--ch);font-weight:800;box-shadow:0 8px 20px -8px #f2c94ccc}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;padding:10px 16px;overflow-x:auto;scrollbar-width:none;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5)}nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--mu);white-space:nowrap;box-shadow:none}nav button:hover{background:var(--card);color:var(--tx)}
nav button.on,.tags button.on{background:var(--ac);color:var(--onac);font-weight:800;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--ac) 80%,transparent)}
main{max-width:1060px;margin:0 auto;padding:8px 16px 56px}
.g{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:700px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.hero{border-radius:0 0 30px 30px}}
.c{background:var(--card);border:1px solid var(--ln);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}.c h2{font-size:15px;font-weight:800;letter-spacing:-.01em;margin:0 0 12px}
.k{border-radius:20px}.k b{display:block;font-size:30px;font-weight:900;letter-spacing:-.02em;line-height:1.15}.k span{color:var(--mu);font-size:12.5px;font-weight:500}
.bal{position:relative;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,var(--b1),var(--b2));color:var(--onac);border-radius:30px;padding:24px 26px;margin-bottom:16px;box-shadow:0 22px 44px -24px var(--b2)}
.bal span,.bal small{display:block;opacity:.8}.bal b{display:block;font-size:44px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.bal button.pr{background:var(--onac);color:var(--ac);border-color:var(--onac);box-shadow:none}
.note{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--ch) 18%,var(--card));border:1px solid color-mix(in srgb,var(--ch) 60%,transparent);border-radius:18px;padding:12px 16px;margin-bottom:16px}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
.rk{display:grid;grid-template-columns:30px 1fr 56px;gap:12px;align-items:center;margin:11px 0;font-weight:600}
.bar{height:12px;border-radius:99px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.row:first-child{border-top:0}
.row .n{flex:1}.pill{padding:3px 11px;border-radius:99px;font-weight:700;background:color-mix(in srgb,var(--tx) 7%,transparent)}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:9px 12px;transition:border-color .15s,box-shadow .15s}
select{background:color-mix(in srgb,var(--ch) 90%,transparent);color:#14213a;font-weight:700;border:0;border-radius:999px;padding:9px 14px}
input:focus,textarea:focus{outline:0;border-color:var(--ch);box-shadow:0 0 0 4px color-mix(in srgb,var(--ch) 30%,transparent)}
textarea{width:100%;height:230px;resize:vertical}.chip{display:block;width:100%;text-align:left;margin:6px 0;border-radius:16px;padding:11px 16px}.chip b{float:right;font-weight:900}
dialog{border:1px solid var(--ln);border-radius:28px;background:var(--card);color:var(--tx);max-width:480px;width:92%;padding:24px;box-shadow:0 40px 80px -30px #000a}dialog::backdrop{background:#070b16b3;backdrop-filter:blur(6px)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14213ae6;color:#fff;padding:11px 20px;border-radius:999px;display:none;z-index:9;font-weight:600;backdrop-filter:blur(12px);box-shadow:0 18px 40px -16px #000a}
table{width:100%;border-collapse:collapse}td,th{padding:9px 8px;border-top:1px solid var(--ln);text-align:left}th{color:var(--mu);font-size:12.5px;font-weight:600;border-top:0}
.gw{font-size:30px;font-weight:900;letter-spacing:-.02em;margin:14px 0 8px}.big{font-size:clamp(30px,9vw,64px);font-weight:900;letter-spacing:-.03em;text-align:center;margin:16px 0;line-height:1.2;word-break:break-word}canvas{max-width:100%;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 18px 24px #14213a3d)}#gb,#gr{text-align:center}#gb .tags{justify-content:center}#gb textarea{text-align:left}.ov{overflow-x:auto}
#tr .c{padding:16px;border-radius:20px}#tr .c h2{font-size:14px;padding-bottom:10px;margin-bottom:6px;border-bottom:2px solid var(--ln)}#tr .c div{padding:5px 0;font-weight:500}#th{margin:-2px 0 14px;font-weight:600}
:focus-visible{outline:2px solid var(--ch);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

GF.team=function(){G.tm=G.tm||"n";G.tv=G.tv||{n:4,s:5};$("gb").innerHTML='<div class="tags"><select id="tm"><option value="n">Chia theo số nhóm</option><option value="s">Chia theo số người mỗi nhóm</option></select><label><span id="tl"></span> <input id="tg" type="number" min="1" style="width:70px"></label><button class="pr" data-g="team">👥 Chia ngẫu nhiên</button></div><p class="mu" id="th"></p><div id="tr" class="g" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));text-align:left"></div>';$("tm").value=G.tm;$("tm").onchange=function(){G.tm=this.value;tUI()};$("tg").oninput=function(){G.tv[G.tm]=+this.value;tHint()};tUI()};
function tPlan(){var t=gp().length,m=G.tm,v=Math.round(+G.tv[m])||(m=="n"?4:5),n=0,s=0;if(t){if(m=="n"){n=Math.max(1,Math.min(t,v));s=Math.ceil(t/n)}else{s=Math.max(1,Math.min(t,v));n=Math.ceil(t/s)}}return{t:t,n:n,s:s}}
function tUI(){$("tl").textContent=G.tm=="n"?"Số nhóm":"Số người mỗi nhóm";$("tg").value=G.tv[G.tm];tHint()}
function tHint(){var p=tPlan(),h;if(!p.t)h="Không có ai trong danh sách.";else if(G.tm=="n"){var q=Math.floor(p.t/p.n),r=p.t%p.n;h=p.t+" người → "+p.n+" nhóm, mỗi nhóm "+(r?q+"–"+(q+1):q)+" người"}else{var r2=p.t%p.s;h=p.t+" người → "+p.n+" nhóm"+(r2?" ("+(p.n-1)+" nhóm "+p.s+" người, nhóm cuối "+r2+" người)":", mỗi nhóm "+p.s+" người")}$("th").textContent=h}
function split(){var a=shuf(gp());if(!a.length){toast("Không có ai trong danh sách");return}var p=tPlan(),gs=[];for(var i=0;i<p.n;i++)gs.push([]);a.forEach(function(x,i){gs[G.tm=="n"?i%p.n:Math.floor(i/p.s)].push(x)});
$("tr").innerHTML=gs.map(function(m,i){return'<div class="c"><h2 style="color:'+PAL[i%8]+'">Nhóm '+(i+1)+' · '+m.length+' người</h2>'+m.map(function(x){return'<div>'+esc(x.n)+'</div>'}).join("")+'</div>'}).join("")}
function tf(s){return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
GF.timer=function(){G.tl=60;tp()};
function tp(){$("gb").innerHTML='<div class="big" id="tt">'+tf(G.tl)+'</div><div class="tags">'+[30,60,180,300].map(function(s){return'<button data-g="tset" data-s="'+s+'">'+(s<60?s+" giây":s/60+" phút")+'</button>'}).join("")+'<input id="ts" type="number" placeholder="giây" style="width:80px"><button data-g="tset" data-s="0">Đặt</button></div><p><button class="pr" data-g="tgo">▶ Bắt đầu / Tạm dừng</button> <button data-g="trs">Đặt lại</button></p>'}
function beep(){try{var c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.start();setTimeout(function(){o.stop()},700)}catch(e){}}
document.addEventListener("click",function(ev){var b=ev.target.closest("[data-g]");if(!b)return;var d=b.dataset,a=d.g;
if(a=="sel"){G.g=d.k;render()}
else if(a=="spin")spin();else if(a=="name")drawName();else if(a=="num")drawNum();else if(a=="team")split();
else if(a=="tset"){clearInterval(G.tk);G.tk=0;G.tl=Math.max(1,Math.round(+d.s||+($("ts")||{}).value||60));say("");tp()}
else if(a=="trs"){clearInterval(G.tk);G.tk=0;G.tl=60;say("");tp()}
else if(a=="tgo"){if(G.tk){clearInterval(G.tk);G.tk=0}else if(G.tl>0){G.tk=setInterval(function(){G.tl--;var e=$("tt");if(e)e.textContent=tf(G.tl);if(G.tl<=0){clearInterval(G.tk);G.tk=0;beep();say('<div class="gw">⏰ Hết giờ!</div>')}},1000)}}
else if(a=="clr"){G.won=[];toast("Đã xóa danh sách người đã trúng");gInit()}
else if(a=="bonus"){var x=G.last;if(!x||!can(x.ti))return;S.events.push({id:"e"+Date.now()+rnd(999),s:x.id,ti:x.ti,t:"b",l:"Thắng trò chơi",n:2,w:VW,d:now(),by:who()});save();b.disabled=true;b.textContent="✓ Đã cộng +2 điểm";toast("+2 điểm cho "+x.n)}});
document.addEventListener("change",function(e){var i=e.target.id;if(i=="gp"){G.pool=e.target.value;gInit()}else if(i=="gs"){G.skip=e.target.checked?1:0;gInit()}});
render();
</script></body></html>
